repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.4.0
    hooks:
      - id: golangci-lint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        exclude: ^.vscode/
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: [-b, main]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: local
    hooks:
      - id: sync-go-version
        name: sync go.mod and Go base image tags to the latest release
        entry: "sh -c 'command -v just >/dev/null || { echo \"warning: just not installed; skipping (CI will still verify). Install: brew install just\" >&2; exit 0; }; exec just sync-go-version'"
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
