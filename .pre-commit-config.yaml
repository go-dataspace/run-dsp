repos:
  # Runs the golangci-lint pinned as a go.mod tool (same binary + module graph
  # as `just lint` in CI), instead of a separately built hook that goes stale
  # against the go directive after every sync-go-version bump.
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: go tool golangci-lint run --new-from-rev HEAD --fix
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        exclude: ^.vscode/
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: [-b, main]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: local
    hooks:
      - id: sync-go-version
        name: sync go.mod and Go base image tags to the latest release
        entry: "sh -c 'command -v just >/dev/null || { echo \"warning: just not installed; skipping (CI will still verify). Please install just.\" >&2; exit 0; }; exec just sync-go-version'"
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
      - id: test-scripts
        name: run tests on scripts in ./scripts
        entry: "scripts/tests/sync-go-version.test.sh"
        language: system
        stages: [pre-push]
        files: ^scripts/
        pass_filenames: false
        verbose: true
