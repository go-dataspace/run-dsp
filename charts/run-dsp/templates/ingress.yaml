{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "run-dsp.fullname" . }}
  labels:
    {{- include "run-dsp.labels" . | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  # tls precedence: explicit .Values.ingress.tls takes priority; otherwise
  # synthesize from .Values.ingress.host + .Values.ingress.tlsSecret
  # (legacy single-host shape). Note: setting `tls: []` or `tls: null` is
  # falsy here and falls through to synthesis — clear tlsSecret too if
  # you want to omit tls.
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- else if .Values.ingress.tlsSecret }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "run-dsp.fullname" $ }}
                port:
                  number: 8080
{{- end }}
